[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "quam"
version = "0.5.0"
description = "Quantum Abstract Machine (QUAM) facilitates development of abstraction layers in experiments."
authors = [
    { name = "Serwan Asaad", email = "serwan.asaad@quantum-machines.co" },
]
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10,<3.14"
readme = "README.md"

classifiers = [
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
]

keywords = [
    "quantum-computing",
    "experiment-control",
    "quantum-infrastructure",
    "abstraction-layer",
    "abstraction-library",
]

dependencies = [
    "numpy >= 1.21.2",
    "scipy",
    "qm-qua >=1.2.3",
    "typeguard >= 4.1.0",
    "qualibrate-config >= 0.1.6",
]

[project.urls]
Homepage = "https://github.com/qua-platform/quam"

[project.scripts]
quam = "quam.config.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest >= 7.1.2",
    "black >= 23.7.0",
    "flake8 >= 5.0.1",
    "pyproject-flake8 >= 5.0.0",
    "mypy >= 1.0.0",
    "ipykernel >= 6.24.0",
    "pytest-cov >= 4.1.0",
    "pytest-mock >= 3.6.1",
    "poethepoet >= 0.24.0",
    "qm-saas",
]
docs = ["mkdocstrings[python]>=0.18", "mkdocs-gen-files", "mkdocs-jupyter"]
build = ["setuptools >= 71", "setuptools-scm >= 8.1.0", "build >= 1.2.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]
filterwarnings = [
    # Quiet known upstream noise so anything new stands out in the CI log.
    # qualibrate_config re-export shims (raised with stacklevel=2, so matched by message).
    "ignore:Module 'qualibrate_config\\..*' is deprecated:DeprecationWarning",
    # qualibrate_config function-level re-export deprecations.
    "ignore:'.*' from 'qualibrate_config\\..*' is deprecated:DeprecationWarning",
    # marshmallow 3 -> 4 field-metadata warnings emitted by qm-qua's schema.
    "ignore:Passing field metadata as keyword arguments is deprecated:DeprecationWarning",
    # Several intentional inline QuAM dataclasses in tests are named Test* — pytest
    # warns it can't collect them because they have __init__ (they're fixtures, not tests).
    "ignore:cannot collect test class:pytest.PytestCollectionWarning",
    # NOTE: a stricter "error" baseline would catch unintentional regressions, but
    # several tests currently exercise deprecation/fallback paths without wrapping
    # the emitted warning in `pytest.warns(...)`. Convert those first, then flip on.
]

[tool.coverage.run]
source = ["quam"]
branch = true
omit = [
    "quam/_version.py",
    "quam/examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
target-version = ["py310"]
line-length = 88
preview = true

[tool.flake8]
max-line-length = 88
# Black handles line length; E501 fires on lines it can't shorten (type: ignore comments, docstrings).
extend-ignore = ["E501"]
per-file-ignores = ["**/__init__.py:F401,F403,F405"]

[tool.setuptools]
packages = ["quam"]

[tool.setuptools_scm]
version_scheme = "only-version"
local_scheme = "no-local-version"

[tool.uv]
prerelease = "allow"

[tool.poe.tasks.format]
cmd = "black quam/"
help = "Auto-format source files"

[tool.poe.tasks.check-format]
cmd = "black --check quam/"
help = "Check formatting without modifying files"

[tool.poe.tasks.lint]
cmd = "pflake8 quam/"
help = "Run flake8 linting"

[tool.poe.tasks.typecheck]
# --ignore-missing-imports: suppress errors for deps without type stubs (e.g. qm-qua).
# --follow-imports=silent: collect type info from followed imports but suppress errors inside them.
cmd = "mypy quam/ --ignore-missing-imports --follow-imports=silent"
help = "Run mypy type checking"

[tool.poe.tasks.test]
cmd = "pytest"
help = "Run all unit tests"

[tool.poe.tasks.check]
sequence = ["check-format", "lint", "typecheck", "test"]
help = "Run all checks (format, lint, types, tests)"
